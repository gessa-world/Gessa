<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061226"><title>GESSA</title><link rel="icon" type="image/png" href="gessa-icon.png"><link rel="apple-touch-icon" href="gessa-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"></head><body><main><h1>التسوق</h1><p class="muted">اكتشف المنتجات والمتاجر داخل GESSA.</p><div class="grid" id="products"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
GESSA.boot('shop',async function(c){const box=document.getElementById('products'),h=GESSA.h;
const r=await c.from('products').select('id,title,description,price_cents,currency,stock,stores(name)').eq('is_active',true).order('created_at',{ascending:false}).limit(60);
if(r.error){GESSA.say(r.error.message);return;}if(!r.data.length){box.append(h('p','muted','لا توجد منتجات معروضة حاليًا.'));return;}
r.data.forEach(p=>{const card=h('article','card');card.append(h('h2','',p.title),h('p','meta','المتجر: '+(p.stores?.name||'متجر GESSA')),h('p','',p.description||''),h('div','price',GESSA.money(p.price_cents,p.currency)),h('p','muted',p.stock>0?'المتاح: '+p.stock:'نفدت الكمية'));box.append(card);});});
</script></body></html>
