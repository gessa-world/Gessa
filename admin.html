<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061226"><title>GESSA</title><link rel="icon" type="image/png" href="gessa-icon.png"><link rel="apple-touch-icon" href="gessa-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"></head><body><main><h1>لوحة مالك GESSA</h1><p class="muted">هذه الصفحة مخصصة لحساب المالك فقط.</p><div class="grid" id="stats"></div><section class="card"><h2>طلبات التجار</h2><div id="merchants">جارٍ التحميل...</div></section><section class="card"><h2>أحدث الأعضاء</h2><div id="members">جارٍ التحميل...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
GESSA.boot('admin',async function(c,user){if((user.app_metadata||{}).role!=='owner'){document.querySelector('main').textContent='هذه الصفحة مخصصة لمالك GESSA فقط.';return;}
const h=GESSA.h,stats=document.getElementById('stats');
const [p,posts,stores,orders]=await Promise.all([c.from('profiles').select('id',{count:'exact',head:true}),c.from('posts').select('id',{count:'exact',head:true}),c.from('stores').select('id',{count:'exact',head:true}),c.from('orders').select('id',{count:'exact',head:true})]);
[['الأعضاء',p.count],['المنشورات',posts.count],['المتاجر',stores.count],['الطلبات',orders.count]].forEach(x=>{const k=h('section','card');k.append(h('div','stat',String(x[1]??'—')),h('div','muted',x[0]));stats.append(k);});
const m=await c.from('merchant_profiles').select('id,business_name,phone,status,created_at').order('created_at',{ascending:false}).limit(30),mb=document.getElementById('merchants');mb.replaceChildren();
if(m.error)mb.textContent=m.error.message;else if(!m.data.length)mb.textContent='لا توجد طلبات تجار.';else m.data.forEach(x=>{const row=h('div','item',x.business_name+' — '+x.phone+' — '+x.status);if(x.status==='pending'){const b=h('button','link','موافقة');b.onclick=async()=>{const r=await c.from('merchant_profiles').update({status:'approved',verified:true}).eq('id',x.id);if(r.error)GESSA.say(r.error.message);else location.reload();};row.append(b);}mb.append(row);});
const u=await c.from('profiles').select('id,username,display_name,created_at').order('created_at',{ascending:false}).limit(30),ub=document.getElementById('members');ub.replaceChildren();if(u.error)ub.textContent=u.error.message;else u.data.forEach(x=>ub.append(h('div','item',(x.display_name||x.username)+' — '+new Date(x.created_at).toLocaleDateString('ar-EG'))));
});
</script></body></html>
