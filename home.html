<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061226">
  <title>GESSA | مجتمعك، عالمك</title>
  <link rel="icon" type="image/png" href="gessa-icon.png">
  <link rel="apple-touch-icon" href="gessa-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #061226;
      --bg2: #0a1d38;
      --card: #102744;
      --line: #24527a;
      --cyan: #38bdf8;
      --red: #e5484d;
      --text: #f4f7fb;
      --muted: #a8bacb;
      --success: #34d399;
      --danger: #fb7185;
      font-family: Tahoma, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 0%, rgba(56,189,248,.13), transparent 34rem),
        linear-gradient(145deg, var(--bg), #081a31 60%, #061226);
    }
    a { color: inherit; text-decoration: none; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(6,18,38,.94);
      border-bottom: 1px solid rgba(56,189,248,.2);
      backdrop-filter: blur(12px);
    }
    .nav {
      width: min(1100px, calc(100% - 28px));
      min-height: 70px; margin: auto;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; padding: 12px 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .brand-mark {
      display: block; width: 48px; height: 48px; object-fit: contain;
      border-radius: 10px; filter: drop-shadow(0 0 10px rgba(56,189,248,.25));
    }
    .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-links a, .logout {
      border: 1px solid #ffb5d5; border-radius: 999px;
      padding: 11px 22px; color: #073a8c; font-size: 14px; font-weight: 900;
      background: linear-gradient(180deg,#ffd0e5 0%,#ff8fbd 48%,#ed5598 100%);
      box-shadow: 0 5px 0 #a92e69, 0 9px 18px rgba(0,0,0,.28), inset 0 2px 3px rgba(255,255,255,.8);
      text-shadow: 0 1px rgba(255,255,255,.55); transition: transform .15s ease, box-shadow .15s ease;
    }
    .nav-links a:hover { color: #052b70; transform: translateY(-2px); box-shadow: 0 7px 0 #a92e69,0 12px 20px #0005,inset 0 2px 3px #fff9; }
    .nav-links a:active { transform: translateY(3px); box-shadow: 0 2px 0 #a92e69,inset 0 2px 5px #0002; }
    .logout { border-color: rgba(229,72,77,.4); color: #ffb4b7; background: transparent; cursor: pointer; }
    main { width: min(920px, calc(100% - 28px)); margin: 34px auto 60px; }
    .welcome { margin-bottom: 22px; }
    .welcome h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 34px); }
    .welcome p { margin: 0; color: var(--muted); line-height: 1.8; }
    .panel {
      background: linear-gradient(145deg, rgba(16,39,68,.96), rgba(10,29,56,.96));
      border: 1px solid var(--line); border-radius: 18px;
      padding: 20px; margin-bottom: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,.18);
    }
    .panel h2 { margin: 0 0 14px; font-size: 19px; }
    textarea {
      display: block; width: 100%; min-height: 115px; resize: vertical;
      border: 1px solid var(--line); border-radius: 12px;
      background: #071a32; color: var(--text); padding: 14px;
      font: inherit; line-height: 1.7; outline: none;
    }
    textarea:focus, input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,189,248,.12); }
    .form-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
    .hint { color: var(--muted); font-size: 12px; }
    button.primary {
      border: 0; border-radius: 11px; padding: 11px 22px;
      color: #041426; background: var(--cyan); font: inherit; font-weight: 800;
      cursor: pointer;
    }
    button.primary:disabled { opacity: .55; cursor: wait; }
    #homeMessage {
      padding: 12px 14px; margin: 0 0 16px; border-radius: 11px;
      background: rgba(56,189,248,.1); border: 1px solid rgba(56,189,248,.35);
      color: var(--text); line-height: 1.7;
    }
    #homeMessage[data-type="error"] { background: rgba(251,113,133,.1); border-color: rgba(251,113,133,.45); }
    #homeMessage[data-type="success"] { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.4); }
    #feed { display: grid; gap: 14px; }
    .empty-state { color: var(--muted); text-align: center; padding: 24px 10px; line-height: 1.8; }
    .post-card { background: rgba(16,39,68,.82); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .post-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .post-head strong { color: var(--cyan); }
    .post-author {display:inline-flex!important;align-items:center;gap:10px;margin:0!important;color:var(--text)!important;text-decoration:none}
    .post-author span{display:grid;gap:2px}.post-author small{color:var(--muted);font-size:11px}
    .post-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan);background:#0a1d38;display:grid;place-items:center}
    .post-avatar-fallback{color:var(--cyan);font-weight:900;font-size:19px}
    .post-card[data-profile-id]{cursor:pointer}.post-card[data-profile-id]:hover{border-color:var(--cyan);box-shadow:0 10px 28px #0004}
    .composer-owner{display:flex;align-items:center;gap:10px;margin-bottom:12px}.composer-owner img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan)}
    .composer-owner a{color:var(--cyan);font-weight:800}
    .post-head time { color: var(--muted); font-size: 12px; }
    .post-content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.9; margin: 0; }
    .post-card a { display: inline-block; margin-top: 12px; color: var(--cyan); }
    .post-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .delete-post { border: 1px solid rgba(229,72,77,.45); background: transparent; color: #ffb4b7; padding: 7px 13px; border-radius: 9px; cursor: pointer; }
    footer { color: var(--muted); text-align: center; padding: 20px; font-size: 12px; }
    @media (max-width: 620px) {
      .nav { align-items: flex-start; }
      .nav-links { width: 100%; }
      .nav-links a { padding: 9px 14px; }
      .form-actions { align-items: flex-start; flex-direction: column; }
      button.primary { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="القائمة الرئيسية">
      <a class="brand" href="home.html" aria-label="GESSA الرئيسية">
        <img class="brand-mark" src="gessa-icon.png" alt="شعار GESSA" width="48" height="48">
      </a>
      <div class="nav-links">
        <a href="home.html">الرئيسية</a>
        <a href="shop.html">التسوق</a>
        <a href="merchant.html">التجار</a>
        <a href="world.html">العالم الافتراضي</a>
        <a href="profile.html">ملفي الشخصي</a>
      </div>
      <button class="logout" id="logoutButton" type="button">تسجيل الخروج</button>
    </nav>
  </header>

  <main>
    <section class="welcome">
      <h1>مرحبًا بك في GESSA</h1>
      <p>مجتمعك، عالمك. شارك أفكارك وتواصل مع مجتمعك.</p>
    </section>

    <div id="homeMessage" role="status" aria-live="polite" hidden></div>

    <section class="panel" aria-labelledby="composerTitle">
      <h2 id="composerTitle">شارك مجتمع GESSA</h2>
      <div class="composer-owner"><a id="composerProfileLink" href="profile.html"><img id="composerAvatar" src="gessa-icon.png" alt="ملفي الشخصي"></a><a id="composerName" href="profile.html">ملفي الشخصي</a></div>
      <form id="pf">
        <textarea id="pb" name="body" maxlength="5000" placeholder="ماذا تريد أن تشارك اليوم؟" required></textarea>
        <div class="form-actions">
          <span class="hint">اكتب مشاركتك ثم اضغط نشر.</span>
          <button class="primary" type="submit">نشر</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="feedTitle">
      <h2 id="feedTitle">أحدث المنشورات</h2>
      <div id="feed" aria-live="polite">
        <p class="empty-state">جارٍ تجهيز مجتمع GESSA...</p>
      </div>
    </section>
  </main>

  <footer>GESSA — مجتمعك، عالمك</footer>

  <!-- يجب أن تكون الملفات الثلاثة في المجلد نفسه: home.html و config.js و app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // زر الخروج اختياري: يعمل إذا كان config.js يعرّض عميل Supabase على window.
    // لا نخمن اسم العميل؛ نعرض رسالة واضحة إذا لم يكن متاحًا.
    document.getElementById("logoutButton")?.addEventListener("click", async () => {
      const message = document.getElementById("homeMessage");
      try {
        const client = window.GESSA?.client?.();
        if (!client?.auth?.signOut) {
          message.textContent = "تعذر تحديد اتصال الحساب. استخدم زر تسجيل الخروج الموجود في إعدادات المشروع إن توفر.";
          message.dataset.type = "error";
          message.hidden = false;
          return;
        }
        const { error } = await client.auth.signOut();
        if (error) throw error;
        window.location.replace("index.html");
      } catch (error) {
        message.textContent = "تعذر تسجيل الخروج: " + (error?.message || "خطأ غير معروف");
        message.dataset.type = "error";
        message.hidden = false;
      }
    });
  </script>
</body>
</html>
