<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06245f">
  <title>GESSA | مجتمعك، عالمك</title>
  <link rel="icon" type="image/png" href="gessa-icon.png">
  <link rel="apple-touch-icon" href="gessa-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --navy: #06245f;
      --card: #102744;
      --line: #24527a;
      --cyan: #38bdf8;
      --text: #f4f7fb;
      --muted: #a8bacb;
      font-family: "Cairo", Tahoma, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background: #061b4a;
    }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }

    /* The supplied reference artwork is the visual source of truth.
       Real transparent link hotspots sit exactly over its five controls. */
    .hero-frame {
      width: min(100%, 1599px);
      margin: 0 auto;
      position: relative;
      isolation: isolate;
      background: #06245f;
    }
    .hero-art {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1096 / 678;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      animation: artworkReveal .7s ease-out both;
    }
    @keyframes artworkReveal {
      from { opacity: .35; filter: brightness(.72); }
      to { opacity: 1; filter: brightness(1); }
    }

    .hotspot {
      position: absolute;
      display: block;
      z-index: 5;
      background: transparent;
      border: 0;
      outline: 0;
      cursor: pointer;
      transform: translateZ(0);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      clip-path: var(--hit-shape);
      transition: transform .16s ease, filter .16s ease;
    }
    .hotspot::after {
      content: "";
      position: absolute;
      inset: 0;
      display: block;
      pointer-events: none;
      opacity: 0;
      /* A nearly transparent screen layer keeps the artwork lettering crisp. */
      background: rgba(255,255,255,.018);
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 8px var(--pulse-color))
              drop-shadow(0 0 18px var(--pulse-color))
              drop-shadow(0 0 30px var(--pulse-color));
      transition: opacity .14s ease;
    }
    .hotspot:hover {
      transform: scale(1.012);
      filter: brightness(1.08) drop-shadow(0 0 10px var(--pulse-color));
    }
    .hotspot:hover::after { opacity: .25; }
    .hotspot:active {
      transform: translateY(3px) scale(.985);
      filter: brightness(1.2) drop-shadow(0 0 16px var(--pulse-color));
      transition-duration: .06s;
    }
    .hotspot:active::after { opacity: .58; }
    .hotspot:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
      filter: drop-shadow(0 0 12px #fff);
    }

    /* World: hit target follows the irregular front sheet and stacked layers. */
    .hotspot-world {
      left: 2.25%; top: 5.4%; width: 29.7%; height: 26.0%;
      --pulse-color: #ff35e8;
      --hit-shape: polygon(0 29%, 5% 15%, 12% 15%, 12% 4%, 19% 4%, 19% 0, 91% 0, 98% 8%, 98% 78%, 88% 87%, 54% 94%, 37% 100%, 0 91%);
    }
    /* Main pink diamond. */
    .hotspot-home {
      left: 32.2%; top: 11.8%; width: 36.0%; height: 28.8%;
      --pulse-color: #ff0755;
      --hit-shape: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
    }
    /* Cloud body. */
    .hotspot-profile {
      left: 69.1%; top: 4.1%; width: 30.1%; height: 28.2%;
      --pulse-color: #9aff4a;
      --hit-shape: polygon(20% 20%, 30% 7%, 43% 4%, 54% 0, 67% 4%, 80% 11%, 94% 21%, 99% 39%, 96% 59%, 88% 76%, 76% 88%, 59% 96%, 43% 95%, 29% 88%, 15% 83%, 5% 67%, 0 49%, 7% 32%);
    }
    /* The three thought dots are separate clickable parts of the same profile link. */
    .hotspot-profile-trail {
      left: 58.0%; top: 21.1%; width: 12.2%; height: 8.8%;
      --pulse-color: #9aff4a;
      --hit-shape: polygon(0 28%, 17% 0, 40% 13%, 56% 0, 83% 10%, 100% 31%, 93% 77%, 69% 100%, 39% 76%, 13% 100%);
    }
    /* Inverted orange triangle. */
    .hotspot-merchant {
      left: 2.1%; top: 36.7%; width: 32.2%; height: 25.0%;
      --pulse-color: #ff9a00;
      --hit-shape: polygon(0 0, 100% 0, 50% 100%);
    }
    /* Blue scroll: outer board, curled top-right, and vertical left roll. */
    .hotspot-shop {
      left: 69.3%; top: 35.0%; width: 28.6%; height: 27.0%;
      --pulse-color: #00c8ff;
      --hit-shape: polygon(9% 8%, 86% 8%, 91% 0, 99% 0, 100% 13%, 100% 85%, 94% 96%, 15% 96%, 9% 100%, 0 92%, 0 19%, 5% 8%);
    }

    /*
       Strong active-button pulse:
       the overlay uses SCREEN blending, so it brightens the original artwork
       instead of darkening or hiding the baked-in Arabic label. The whole
       clipped hotspot also casts a colored outer glow.
    */
    .hotspot.is-current {
      background: rgba(255,255,255,.22);
      mix-blend-mode: screen;
      animation: activeButtonBlink 1s steps(1, end) infinite;
      will-change: opacity, filter;
    }

    /* Keep the label in the reference artwork unobstructed. */
    .hotspot.is-current::after {
      opacity: 0;
      animation: none;
      background: transparent;
      filter: none;
    }

    @keyframes activeButtonBlink {
      0%, 49.999% {
        opacity: .94;
        filter: brightness(1.24)
                drop-shadow(0 0 18px var(--pulse-color))
                drop-shadow(0 0 42px var(--pulse-color))
                drop-shadow(0 0 72px var(--pulse-color));
      }
      50%, 100% {
        opacity: .07;
        filter: brightness(1)
                drop-shadow(0 0 2px var(--pulse-color))
                drop-shadow(0 0 6px var(--pulse-color));
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* Account controls are kept outside the artwork so the reference remains exact. */
    .community-area {
      width: min(920px, calc(100% - 28px));
      margin: 18px auto 0;
      padding-bottom: 10px;
    }
    .account-toolbar {
      display: flex;
      justify-content: flex-start;
      margin: 0 0 12px;
    }
    .logout {
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px;
      padding: 7px 16px;
      color: #f3f8ff;
      background: linear-gradient(180deg, #174b91, #08285d);
      box-shadow: 0 4px 0 #03183e, 0 8px 16px rgba(0,0,0,.28), inset 0 1px 2px rgba(255,255,255,.35);
      font: 800 13px "Cairo", Tahoma, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }
    .logout:hover { transform: translateY(-2px); filter: brightness(1.16); }
    .logout:active { transform: translateY(3px); box-shadow: 0 1px 0 #03183e; }
    .logout:disabled { opacity: .6; cursor: wait; }

    .panel {
      background: linear-gradient(145deg, rgba(16,39,68,.97), rgba(8,27,57,.97));
      border: 1px solid rgba(76,137,190,.48);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .panel h2 { margin: 0 0 14px; font-size: 19px; }
    textarea {
      display: block;
      width: 100%;
      min-height: 115px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #071a32;
      color: var(--text);
      padding: 14px;
      font: inherit;
      line-height: 1.7;
      outline: none;
    }
    textarea:focus, input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56,189,248,.12);
    }
    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    .hint { color: var(--muted); font-size: 12px; }
    button.primary {
      border: 0;
      border-radius: 11px;
      padding: 11px 22px;
      color: #041426;
      background: var(--cyan);
      font: 800 15px "Cairo", Tahoma, sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 0 #12638d, 0 7px 14px rgba(0,0,0,.25);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button.primary:hover { transform: translateY(-2px); }
    button.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #12638d; }
    button.primary:disabled { opacity: .55; cursor: wait; }
    #homeMessage {
      padding: 12px 14px;
      margin: 0 0 16px;
      border-radius: 11px;
      background: rgba(56,189,248,.1);
      border: 1px solid rgba(56,189,248,.35);
      color: var(--text);
      line-height: 1.7;
    }
    #homeMessage[data-type="error"] { background: rgba(251,113,133,.1); border-color: rgba(251,113,133,.45); }
    #homeMessage[data-type="success"] { background: rgba(52,211,153,.1); border-color: rgba(52,211,153,.4); }
    #feed { display: grid; gap: 14px; }
    .empty-state { color: var(--muted); text-align: center; padding: 24px 10px; line-height: 1.8; }
    .post-card { background: rgba(16,39,68,.82); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .post-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .post-head strong { color: var(--cyan); }
    .post-author { display: inline-flex !important; align-items: center; gap: 10px; margin: 0 !important; color: var(--text) !important; text-decoration: none; }
    .post-author span { display: grid; gap: 2px; }
    .post-author small { color: var(--muted); font-size: 11px; }
    .post-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--cyan); background: #0a1d38; display: grid; place-items: center; }
    .post-avatar-fallback { color: var(--cyan); font-weight: 900; font-size: 19px; }
    .post-card[data-profile-id] { cursor: pointer; }
    .post-card[data-profile-id]:hover { border-color: var(--cyan); box-shadow: 0 10px 28px #0004; }
    .composer-owner { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .composer-owner img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--cyan); }
    .composer-owner a { color: var(--cyan); font-weight: 800; }
    .post-head time { color: var(--muted); font-size: 12px; }
    .post-content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.9; margin: 0; }
    .post-card a { display: inline-block; margin-top: 12px; color: var(--cyan); }
    .post-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .delete-post { border: 1px solid rgba(229,72,77,.45); background: transparent; color: #ffb4b7; padding: 7px 13px; border-radius: 9px; cursor: pointer; }
    .site-footer { color: var(--muted); text-align: center; padding: 22px 16px 30px; font-size: 12px; }

    @media (max-width: 600px) {
      .community-area { width: calc(100% - 20px); margin-top: 14px; }
      .panel { padding: 15px; }
      .form-actions { align-items: flex-start; flex-direction: column; }
      button.primary { width: 100%; }
      .post-head { align-items: flex-start; }
      .logout { padding: 6px 13px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-art { animation: none; }
      .hotspot, .logout, button.primary { transition: none !important; }
      .hotspot.is-current {
        animation: none;
        opacity: .58;
        background: rgba(255,255,255,.22);
        mix-blend-mode: screen;
        filter: brightness(1.18)
                drop-shadow(0 0 16px var(--pulse-color))
                drop-shadow(0 0 36px var(--pulse-color))
                drop-shadow(0 0 60px var(--pulse-color));
      }
      .hotspot.is-current::after { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>

  <section class="hero-frame" id="homeTop" aria-label="الأقسام الرئيسية في GESSA">
    <img class="hero-art" src="gessa-home-reference.png" alt="واجهة GESSA الرئيسية" width="1096" height="678" draggable="false">

    <a class="hotspot hotspot-world" href="world.html" aria-label="العالم الافتراضي" title="العالم الافتراضي"><span class="sr-only">العالم الافتراضي</span></a>
    <a class="hotspot hotspot-home" href="home.html" aria-label="الصفحة الرئيسية" title="الصفحة الرئيسية"><span class="sr-only">الصفحة الرئيسية</span></a>
    <a class="hotspot hotspot-profile" href="profile.html" aria-label="ملفي الشخصي" title="ملفي الشخصي"><span class="sr-only">ملفي الشخصي</span></a>
    <a class="hotspot hotspot-profile-trail" href="profile.html" aria-label="فتح الملف الشخصي" title="ملفي الشخصي"><span class="sr-only">امتداد زر الملف الشخصي</span></a>
    <a class="hotspot hotspot-merchant" href="merchant.html" aria-label="التجار" title="التجار"><span class="sr-only">التجار</span></a>
    <a class="hotspot hotspot-shop" href="shop.html" aria-label="التسوق" title="التسوق"><span class="sr-only">التسوق</span></a>
  </section>

  <!-- A real header remains on the page so config.js does not inject another nav. -->
  <main class="community-area">
    <header class="account-toolbar">
      <button class="logout" id="logoutButton" type="button">تسجيل الخروج</button>
    </header>

    <div id="homeMessage" role="status" aria-live="polite" hidden></div>

    <section class="panel" aria-labelledby="composerTitle">
      <h2 id="composerTitle">شارك مجتمع GESSA</h2>
      <div class="composer-owner">
        <a id="composerProfileLink" href="profile.html"><img id="composerAvatar" src="gessa-icon.png" alt="ملفي الشخصي"></a>
        <a id="composerName" href="profile.html">ملفي الشخصي</a>
      </div>
      <form id="pf">
        <textarea id="pb" name="body" maxlength="5000" placeholder="ماذا تريد أن تشارك اليوم؟" required></textarea>
        <div class="form-actions">
          <span class="hint">اكتب مشاركتك ثم اضغط نشر.</span>
          <button class="primary" type="submit">نشر</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="feedTitle">
      <h2 id="feedTitle">أحدث المنشورات</h2>
      <div id="feed" aria-live="polite">
        <p class="empty-state">جارٍ تجهيز مجتمع GESSA...</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">GESSA — مجتمعك، عالمك</footer>

  <!-- Keep the existing Supabase client, config.js, and app.js integration. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (() => {
      const path = (location.pathname.split("/").pop() || "home.html").toLowerCase();
      const routeMap = {
        "home.html": [".hotspot-home"],
        "world.html": [".hotspot-world"],
        "profile.html": [".hotspot-profile", ".hotspot-profile-trail"],
        "merchant.html": [".hotspot-merchant"],
        "shop.html": [".hotspot-shop"]
      };
      (routeMap[path] || routeMap["home.html"]).forEach(selector => {
        document.querySelector(selector)?.classList.add("is-current");
      });
    })();

    document.getElementById("logoutButton")?.addEventListener("click", async () => {
      const button = document.getElementById("logoutButton");
      const message = document.getElementById("homeMessage");
      button.disabled = true;
      button.textContent = "جارٍ تسجيل الخروج...";
      try {
        const client = window.GESSA?.client?.();
        if (!client?.auth?.signOut) throw new Error("تعذر تحديد اتصال الحساب.");
        const { error } = await client.auth.signOut({ scope: "local" });
        if (error) throw error;
        window.location.replace("index.html");
      } catch (error) {
        message.textContent = "تعذر تسجيل الخروج: " + (error?.message || "خطأ غير معروف");
        message.dataset.type = "error";
        message.hidden = false;
        button.disabled = false;
        button.textContent = "تسجيل الخروج";
      }
    });
  </script>
</body>
</html>
