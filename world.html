<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061226"><title>GESSA</title><link rel="icon" type="image/png" href="gessa-icon.png"><link rel="apple-touch-icon" href="gessa-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"></head><body><main><h1>العالم الافتراضي</h1><div class="grid"><section class="card"><h2>محفظتك</h2><div class="stat" id="coins">—</div><p class="muted">رصيد العملات الافتراضية</p></section><section class="card"><h2>العوالم المتاحة</h2><div id="worlds" class="muted">جارٍ التحميل...</div></section></div><section class="card"><h2>العالم المفتوح</h2><p class="muted">هذه هي المرحلة الأساسية لملف العالم الافتراضي. الحركة ثلاثية الأبعاد والصوت المتزامن تحتاج إلى عميل ألعاب وخادم مخصص، وسيتم ربطهما بهذه الصفحة في مرحلة لاحقة.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
GESSA.boot('world',async function(c,user){const h=GESSA.h;
const w=await c.from('wallets').select('coins').eq('user_id',user.id).maybeSingle();if(w.error)GESSA.say(w.error.message);document.getElementById('coins').textContent=Number(w.data?.coins||0).toLocaleString('ar-EG');
const r=await c.from('worlds').select('name,max_players').limit(30),box=document.getElementById('worlds');box.replaceChildren();if(r.error){box.textContent='تعذر تحميل العوالم: '+r.error.message;return;}if(!r.data.length){box.textContent='سيتم الإعلان عن أول العوالم قريبًا.';return;}r.data.forEach(x=>box.append(h('div','item',x.name+' — '+x.max_players+' لاعب')));});
</script></body></html>
