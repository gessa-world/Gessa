<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061226"><title>GESSA</title><link rel="icon" type="image/png" href="gessa-icon.png"><link rel="apple-touch-icon" href="gessa-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"></head><body><header class="site-header"><a class="logo" href="index.html" aria-label="GESSA"><img src="gessa-icon.png" alt="شعار GESSA" width="54" height="54"></a></header><main><section class="card"><h1>تعيين كلمة مرور جديدة</h1><p class="muted">اكتب كلمة المرور الجديدة لحسابك.</p><form id="resetForm"><input id="newPassword" type="password" minlength="8" placeholder="كلمة المرور الجديدة" required><input id="confirmPassword" type="password" minlength="8" placeholder="تأكيد كلمة المرور" required><button>حفظ كلمة المرور</button></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(async function(){try{const c=GESSA.client();const {data}=await c.auth.getSession();if(!data.session)GESSA.say('افتح رابط إعادة التعيين الذي وصلك على البريد أولًا.');
document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a.length<8)return GESSA.say('كلمة المرور يجب ألا تقل عن 8 أحرف.');if(a!==b)return GESSA.say('كلمتا المرور غير متطابقتين.');const r=await c.auth.updateUser({password:a});if(r.error)return GESSA.say(r.error.message);GESSA.say('تم تغيير كلمة المرور. يمكنك تسجيل الدخول الآن.');setTimeout(()=>location.href='index.html',1200);};}catch(e){GESSA.say(e.message);}})();
</script></body></html>
