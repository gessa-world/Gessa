<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061226"><title>GESSA</title><link rel="icon" type="image/png" href="gessa-icon.png"><link rel="apple-touch-icon" href="gessa-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/app.css"></head><body><main><h1>مساحة التجار</h1><div id="merchantBox"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
GESSA.boot('merchant',async function(c,user){const box=document.getElementById('merchantBox'),h=GESSA.h;
function field(form,name,placeholder,type='text'){const i=h('input');i.name=name;i.placeholder=placeholder;i.type=type;i.required=true;form.append(i);return i;}
async function start(){box.replaceChildren();const q=await c.from('merchant_profiles').select('status,business_name').eq('id',user.id).maybeSingle();if(q.error){GESSA.say(q.error.message);return;}
if(!q.data){const f=h('form','card');f.append(h('h2','','قدّم طلب الانضمام كتاجر'));field(f,'business','اسم النشاط التجاري');field(f,'phone','رقم الهاتف','tel');const b=h('button','','إرسال الطلب');f.append(b);f.onsubmit=async e=>{e.preventDefault();const z=await c.from('merchant_profiles').insert({id:user.id,business_name:f.elements.business.value.trim(),phone:f.elements.phone.value.trim(),status:'pending'});if(z.error)GESSA.say(z.error.message);else{GESSA.say('تم إرسال طلبك للمراجعة.');start();}};box.append(f);return;}
if(q.data.status==='pending'){box.append(h('div','card','طلبك قيد المراجعة. ستتمكن من إنشاء متجرك بعد موافقة الإدارة.'));return;}
if(q.data.status!=='approved'){box.append(h('div','card','حالة حساب التاجر موقوفة حاليًا.'));return;}
const f=h('form','card');f.append(h('h2','','إنشاء متجر'));field(f,'name','اسم المتجر');field(f,'slug','رابط المتجر بالإنجليزية');const d=h('textarea');d.name='description';d.placeholder='وصف المتجر';f.append(d,h('button','','إنشاء المتجر'));f.onsubmit=async e=>{e.preventDefault();const z=await c.from('stores').insert({owner_id:user.id,name:f.elements.name.value.trim(),slug:f.elements.slug.value.trim().toLowerCase(),description:d.value.trim()});if(z.error)GESSA.say(z.error.message);else{GESSA.say('تم إنشاء المتجر.');start();}};box.append(f);
const stores=await c.from('stores').select('id,name,slug').eq('owner_id',user.id);(stores.data||[]).forEach(s=>{const card=h('section','card');card.append(h('h2','',s.name));const pf=h('form','row');field(pf,'title','اسم المنتج');field(pf,'price','السعر بالجنيه','number');field(pf,'stock','الكمية','number');pf.append(h('button','','إضافة'));const list=h('div');pf.onsubmit=async e=>{e.preventDefault();const z=await c.from('products').insert({store_id:s.id,title:pf.elements.title.value.trim(),price_cents:Math.round(Number(pf.elements.price.value)*100),stock:Number(pf.elements.stock.value)});if(z.error)GESSA.say(z.error.message);else{pf.reset();GESSA.say('تمت إضافة المنتج.');}};card.append(pf,list);box.append(card);});}
start();});
</script></body></html>
